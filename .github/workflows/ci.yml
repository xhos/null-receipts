name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: lint
        run: nix develop --command golangci-lint run ./...
      - name: test
        run: nix develop --command go test ./... -v
      - name: build deployable package
        run: nix build --no-link

  notify:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.NULL_DISPATCH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'xhos',
              repo: 'null',
              workflow_id: 'update-input.yml',
              ref: 'main',
              inputs: { input: 'null-receipts' },
            });
